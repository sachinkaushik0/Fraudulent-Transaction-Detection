# Fraud Detection Configuration

# Data Paths
data:
  raw_path: "data/raw/creditcard.csv"
  processed_path: "data/processed/fraud_features.csv"
  synthetic_path: "data/synthetic/fraud_smote.csv"
  train_path: "data/processed/X_train.csv"
  test_path: "data/processed/X_test.csv"

# Preprocessing
preprocessing:
  test_size: 0.3
  random_state: 42
  scale_features: true
  
# SMOTE Configuration
smote:
  sampling_strategy: 0.5  # Minority class to majority class ratio
  k_neighbors: 5
  random_state: 42

# Feature Engineering
features:
  time_based: true
  amount_based: true
  velocity: true
  statistical: true

# XGBoost Hyperparameters
xgboost:
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  scale_pos_weight: 10  # Handle imbalance
  objective: "binary:logistic"
  eval_metric: "auc"
  random_state: 42
  n_jobs: -1

# Model Evaluation
evaluation:
  cv_folds: 5
  metrics:
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"
  threshold: 0.5
  
# SHAP Configuration
shap:
  max_display: 20
  sample_size: 1000  # For faster computation

# Model Saving
model:
  save_path: "models/xgboost_fraud.pkl"
  version: "1.0"

# Output Paths
outputs:
  plots_dir: "outputs/plots"
  reports_dir: "outputs/reports"
